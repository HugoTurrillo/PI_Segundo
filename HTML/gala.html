<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gala</title>

  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body data-rol="organizador">

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Buscar...">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="organizador.html">Panel</a></li>
      <li><a href="sobre_nosotros.html" class="active">Sobre nosotros</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">

  <h2 class="page-title">Gala</h2>

  <!-- Botones dinámicos -->
  <div id="gala-botones" class="gala-botones">

    <!-- Botones Pre/Post -->
    <div class="gala-switch">
      <button id="btn-pre" class="btn login-btn gala-btn">
        Pre-evento
      </button>

      <button id="btn-post" class="btn login-btn gala-btn">
        Post-evento
      </button>
    </div>

  </div>

  <!-- Contenido dinámico -->
  <div id="gala-contenido"></div>

</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
      <a href="../HTML/contacto.html" class="footer-contact-link">Contacta con nosotros</a>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/gala.js"></script>

</body>
</html>
