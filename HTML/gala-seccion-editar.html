<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Sección</title>

  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body data-rol="organizador">

<header class="navbar">
  <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
      <input type="text" placeholder="Buscar...">
  </div>

  <nav>
   <ul class="nav-links">
      <li><a href="gala.html">Gala</a></li>
      <li><a href="sobre_nosotros.html" class="active">Sobre nosotros</a></li>
   </ul>
  </nav>

  <div class="nav-buttons">
      <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">
  <h2>Editar Sección</h2>

  <form id="form-seccion" class="login-form">

    <label>Título</label>
    <input type="text" id="titulo" name="titulo">
    <span class="error-campo" id="error-titulo"></span>

    <label>Hora</label>
    <input type="time" id="hora" name="hora">
    <span class="error-campo" id="error-hora"></span>

    <label>Sala</label>
    <input type="text" id="sala" name="sala">
    <span class="error-campo" id="error-sala"></span>

    <label>Descripción</label>
    <textarea id="descripcion" name="descripcion" rows="4"></textarea>
    <span class="error-campo" id="error-descripcion"></span>

    <div class="error-global" id="error-global"></div>

    <button type="submit" class="btn login-btn">Guardar cambios</button>
     <button
      type="button"
      class="btn login-btn"
       style="background:#555;"
      onclick="window.location.href='gala.html'">
      Salir sin guardar
      </button>
  </form>
</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
      <a href="../HTML/contacto.html" class="footer-contact-link">Contacta con nosotros</a>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/gala-seccion.js"></script>

</body>
</html>
