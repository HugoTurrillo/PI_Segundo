<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir categoría</title>

  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body data-rol="organizador">

<header class="navbar">
  <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>



  <nav>
   <div class="nav-right">
    <a href="organizador.html" style="text-decoration: none; color: rgb(30, 30, 30);">Panel</a>
    <a href="premios.html" style="text-decoration: none; color: rgb(30, 30, 30);">Premios</a>
     <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
  </nav>

   
</header>

<main class="login-container">
  <h2>Añadir categoría</h2>

  <form id="form-categoria" class="login-form">

    <label for="nombre">Nombre de la categoría</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error-campo" id="error-nombre"></span>

    <label for="premios">Descripción de premios</label>
    <input type="text" id="premios" name="premios" required>
    <span class="error-campo" id="error-premios"></span>

    <label for="premio-fisico">Premio físico</label>
    <input type="text" id="premio-fisico" name="premio_fisico" required>
    <span class="error-campo" id="error-premio-fisico"></span>

    <div class="error-global" id="error-global"></div>

    <button type="submit" class="btn login-btn">Guardar categoría</button>
  </form>
</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
       <a href="../HTML/sobre_nosotros.html" class="footer-contact-link">Sobre nosotros: ¿Quiénes Somos?</a><br>
      <a href="../HTML/contacto.html" class="footer-contact-link">Contáctanos</a>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/premios.js"></script>

</body>
</html>
