<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganador Carrera Profesional</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <script defer src="../JS/premios.js"></script>
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>
<body data-rol="organizador">

<header class="navbar">
  <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
      <input type="text" placeholder="Buscar...">
  </div>

  <nav>
   <ul class="nav-links">
      <li><a href="organizador.html" style="text-decoration: none; color: rgb(30, 30, 30);">Panel</a></li>
      <li><a href="premios.html" style="text-decoration: none; color: rgb(30, 30, 30);">Premios</a></li>
   </ul>
  </nav>

  <div class="nav-buttons">
      <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">
  <h2>Ganador Carrera Profesional</h2>

  <form id="form-carrera" class="login-form">

    <label for="nombre">Nombre y apellidos</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error-campo" id="error-nombre"></span>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required>
    <span class="error-campo" id="error-email"></span>

    <label for="telefono">Teléfono de contacto</label>
    <input type="tel" id="telefono" name="telefono" required>
    <span class="error-campo" id="error-telefono"></span>

    <label for="video">Vídeo del recorrido profesional</label>
    <input type="file" id="video" name="video" accept="video/*" required>
    <span class="error-campo" id="error-video"></span>

    <div class="error-global" id="error-global"></div>

    <button type="submit" class="btn login-btn">Guardar ganador</button>
  </form>
</main>

<footer class="footer">

  <div class="footer-main">

    
    <div class="footer-col footer-brand">
      <img src="../IMG/logo-ue-blanco.png" alt="Festival Universitario" class="footer-logo">
      <p class="footer-tagline">Talento universitario en acción</p>
    </div>

    
    <div class="footer-col footer-links">
      <a href="sobre_nosotros.html">Quiénes somos</a>
      <a href="contacto.html">Contacta con nosotros</a>
    </div>

    <!-- COLUMNA 3 · REDES -->
    <div class="footer-col footer-social">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      <a href="#" aria-label="X"><i class="fab fa-x-twitter"></i></a>
    </div>

  </div>

  <!-- FRANJA ROJA -->
  <div class="footer-bottom">
    © 2026 Festival Universitario
  </div>

</footer>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/auth.js"></script>



</body>
</html>
