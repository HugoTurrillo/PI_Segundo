  <link rel="stylesheet" href="../CSS/estilos.css">

</head>

<body>

<header class="navbar">
    <div class="logo">
        <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Buscar...">
    </div>

    <nav>
     <ul class="nav-links">
      <li><a href="../php/home.php">Inicio</a></li>
        <li><a href="calendario.html">Calendario</a></li>

        <a href="login.html" class="btn nav-btn">Acceso</a>
        <a href="registro.html" class="btn nav-btn">Unirse</a>
    </div>
</header>

<main class="login-container">
  <h2>Crea tu cuenta</h2>

  <form class="login-form" id="formRegistro">
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error-campo" id="error-nombre"></span>

    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required>
    <span class="error-campo" id="error-email"></span>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>
    <span class="error-campo" id="error-password"></span>

    <button type="submit" class="btn login-btn">Registrarse</button>

    <div id="registroErrorGlobal" class="error-global"></div>
  </form>
</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
      <p>Contacta con nosotros</p>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
