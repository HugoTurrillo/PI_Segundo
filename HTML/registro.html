</head>

<body>

  <header class="navbar">
    <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">

    <div class="nav-right">
      <a href="../php/home.php" style="text-decoration: none; color: rgb(30, 30, 30);">Inicio</a>
      <li><a href="calendario.html" style="text-decoration: none; color: rgb(30, 30, 30);">Calendario</a></li>

       
  </div>



    <div class="nav-buttons">
      <a href="login.html" class="btn nav-btn">Acceso</a>
    </div>
  </header>

  <main class="login-container">
    <h2>Crear cuenta y enviar candidatura</h2>

    <form class="login-form" id="formRegistro" enctype="multipart/form-data">

      <!-- DATOS DE USUARIO -->
      <h3>Datos personales</h3>

      <label>Nombre completo</label>
      <input type="text" id="nombre" name="nombre">
      <span class="error-campo" id="error-nombre"></span>

      <label>Correo</label>
      <input type="email" id="email" name="email">
      <span class="error-campo" id="error-email"></span>

      <label>Contraseña</label>
      <input type="password" id="password" name="password">
      <span class="error-campo" id="error-password"></span>

      <label>DNI</label>
      <input type="text" id="dni" name="dni">

      <label>Número de expediente</label>
      <input type="text" id="numero_expediente" name="numero_expediente">
      <span class="error-campo" id="error-numero-expediente"></span>

      <span class="error-campo" id="error-rol"></span>

      <hr>

      <!-- DATOS DE CANDIDATURA -->
      <h3>Datos de la candidatura</h3>

      <label>Título de la obra</label>
      <input type="text" id="titulo_obra" name="titulo_obra">

      <label>Sinopsis</label>
      <textarea id="sinopsis" name="sinopsis"></textarea>

      <label>Categoría</label>
      <select id="id_categoria" name="id_categoria">
        <option value="">Selecciona categoría</option>
        <option value="1">Alumni</option>
        <option value="2">Alumnos</option>
      </select>

      <label>Vídeo</label>
      <input type="file" id="video" name="video" accept="video/*">

      <label>Portada</label>
      <input type="file" id="portada" name="portada" accept="image/*">

      <div id="registroErrorGlobal" class="error-global"></div>

      <button type="submit" class="btn login-btn">Registrarse y enviar candidatura</button>

    </form>
  </main>

 
<footer class="footer">

  <div class="footer-main">
