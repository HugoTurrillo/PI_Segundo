<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro + Candidatura</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Buscar...">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="../php/home.php">Inicio</a></li>
      <li><a href="calendario.html">Calendario</a></li>
      <li><a href="sobre_nosotros.html">Sobre nosotros</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="login.html" class="btn nav-btn">Acceso</a>
    <a href="registro.html" class="btn nav-btn">Unirse</a>
  </div>
</header>

<main class="login-container">
  <h2>Crear cuenta y enviar candidatura</h2>

  <form class="login-form" id="formRegistro" enctype="multipart/form-data">

    <!-- DATOS DE USUARIO -->
    <h3>Datos personales</h3>

    <label>Nombre completo</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error-campo" id="error-nombre"></span>

    <label>Correo</label>
    <input type="email" id="email" name="email" required>
    <span class="error-campo" id="error-email"></span>

    <label>Contraseña</label>
    <input type="password" id="password" name="password" required>
    <span class="error-campo" id="error-password"></span>

    <label>Perfil</label>
    <select id="rol_participante" name="rol_participante" required>
      <option value="">Selecciona tu perfil</option>
      <option value="alumno">Alumno</option>
      <option value="alumni">Alumni</option>
      <option value="profesional">Profesional</option>
    </select>
    <span class="error-campo" id="error-rol"></span>

    <hr>

    <!-- DATOS DE CANDIDATURA -->
    <h3>Datos de la candidatura</h3>

    <label>Título de la obra</label>
    <input type="text" id="titulo_obra" name="titulo_obra" required>

    <label>Sinopsis</label>
    <textarea id="sinopsis" name="sinopsis" required></textarea>

    <label>DNI</label>
    <input type="text" id="dni" name="dni" required>

    <label>Categoría</label>
    <select id="id_categoria" name="id_categoria" required>
      <option value="">Selecciona categoría</option>
      <option value="1">Alumni</option>
      <option value="2">Alumnos</option>
      <option value="3">Profesionales</option>
    </select>

    <label>Vídeo</label>
    <input type="file" id="video" name="video" accept="video/*" required>

    <label>Portada</label>
    <input type="file" id="portada" name="portada" accept="image/*" required>

    <div id="registroErrorGlobal" class="error-global"></div>

    <button type="submit" class="btn login-btn">Registrarse y enviar candidatura</button>

  </form>
</main>

<footer class="footer">
  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/registro.js"></script>

</body>
</html>
