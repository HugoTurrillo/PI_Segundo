<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Buscar...">
    </div>

    <nav>
      <ul class="nav-links">
        <li><a href="../php/home.php">Inicio</a></li>
        <li><a href="calendario.html">Calendario</a></li>

  </header>

  <!-- LOGIN -->

  <main class="login-container">
    <h2>Accede a tu cuenta</h2>

    <!-- FORMULARIO FUNCIONAL CON JS -->
    <form class="login-form" id="formLogin">
      <label for="expediente">Correo / Nº de expediente</label>
      <input type="text" id="expediente" name="email" required>
      <span class="error-campo" id="error-expediente"></span>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
      <span class="error-campo" id="error-password"></span>



      <button type="submit" class="btn login-btn">Acceder</button>

      <div id="loginErrorGlobal" class="error-global"></div>


    </form>
  </main>


  <footer class="footer">
    <div class="footer-main">
      <div class="footer-left">
        <div class="footer-social-row">
          <img src="../IMG/instagram.png" alt="Instagram">

        </div>
        <div class="footer-social-row">
          <img src="../IMG/facebook.png" alt="Facebook">
          <span>@cortosuem</span>
        </div>
        <div class="footer-social-row">

          <span>@cortosuem</span>
        </div>
      </div>

      <div class="footer-center">
        <a href="../HTML/contacto.html" class="footer-contact-link">Contacta con nosotros</a>
      </div>

      <div class="footer-right">
        <div class="footer-logo-circle">

    </div>

    </div>
