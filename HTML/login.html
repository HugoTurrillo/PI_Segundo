<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Universidad Europea</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body>

  <!-- NAVBAR (dinámico: si ya estás logueado se muestra Salir + Panel) -->
    <div id="navbar-container"></div>
  <script src="../JS/navbar.js"></script>

<!-- LOGIN -->

  <main class="login-container">
    <h2>Accede a tu cuenta</h2>

    <!-- FORMULARIO FUNCIONAL CON JS -->
    <form class="login-form" id="formLogin">
      <label for="expediente">Correo</label>
      <input type="text" id="expediente" name="email">
      <span class="error-campo" id="error-expediente"></span>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password">
      <span class="error-campo" id="error-password"></span>



      <button type="submit" class="btn login-btn">Acceder</button>

      <div id="loginErrorGlobal" class="error-global"></div>


    </form>
  </main>


  <footer class="footer">

  <div class="footer-main">

    
    <div class="footer-col footer-brand">
      <img src="../IMG/logo-ue-blanco.png" alt="Festival Universitario" class="footer-logo">
      <p class="footer-tagline">Talento universitario en acción</p>
    </div>

    
    <div class="footer-col footer-links">
      <a href="sobre_nosotros.html">Quiénes somos</a>
      <a href="contacto.html">Contacta con nosotros</a>
    </div>

    <!-- COLUMNA 3 · REDES -->
    <div class="footer-col footer-social">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      <a href="#" aria-label="X"><i class="fab fa-x-twitter"></i></a>
    </div>

  </div>

  <!-- FRANJA ROJA -->
  <div class="footer-bottom">
    © 2026 Festival Universitario
  </div>

</footer>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- <script src="../JS/auth.js"></script> -->
  <script src="../JS/login.js"></script>
</body>

</html>
