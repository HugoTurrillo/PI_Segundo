<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva candidatura</title>

  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Buscar...">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="home.html">Inicio</a></li>
      <li><a href="calendario.html">Calendario</a></li>
      <li><a href="participante.html">Mi participación</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="../php/logout.php" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">

  <h2>Presentar candidatura</h2>
  <p>Completa el formulario para inscribir tu obra en el festival.</p>

  <form id="form-candidatura">

    <label>Título de la obra</label>
    <input type="text" id="titulo_obra">
    <span class="error-campo" id="error-titulo"></span>

    <label>Nombre de contacto</label>
    <input type="text" id="nombre_contacto">
    <span class="error-campo" id="error-nombre"></span>

    <label>Email de contacto</label>
    <input type="email" id="email_contacto">
    <span class="error-campo" id="error-email"></span>

    <label>DNI</label>
    <input type="text" id="dni" placeholder="12345678Z">
    <span class="error-campo" id="error-dni"></span>

    <label>Sinopsis</label>
    <textarea id="sinopsis" rows="4"></textarea>

    <button type="submit" class="btn login-btn" style="margin-top:1rem;">
      Enviar candidatura
    </button>

    <p class="error-global" id="error-global"></p>

  </form>

</main>

<!-- FOOTER -->
  <footer class="footer">
    <div class="footer-main">
      <div class="footer-left">
        <div class="footer-social-row">
          <img src="../IMG/instagram.png" alt="Instagram">

      <div class="footer-center">

      </div>

      <div class="footer-right">
        <div class="footer-logo-circle">
          <img src="../IMG/logosimple.jpg" alt="Logo">
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      Universidad Europea © 2025. Todos los Derechos Reservados
    </div>
  </footer>
