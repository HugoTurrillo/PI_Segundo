<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignar ganador</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>
<body data-rol="organizador">

<header class="navbar">
  <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>


    <div class="nav-right">
          <a href="ganadores.html" style="text-decoration: none; color: rgb(30, 30, 30);">Ganadores</a>
          <a href="calendario.html" style="text-decoration: none; color: rgb(30, 30, 30);">Calendario</a>
      
  </div>



  <div class="nav-buttons">
    <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">

  <h2 id="titulo-form">Asignar ganador</h2>

  <label>Categoría:</label>
  <select id="select_categoria" required style="margin-bottom:1rem;"></select>

  <div id="info-categoria" class="panel-card" style="padding:1.2rem; margin-bottom:1.5rem;">
    Cargando categoría...
  </div>

  <form id="form-ganador" class="panel-card" style="padding:1.5rem;">
    
    <label>Premio:</label>
    <select id="numero_premio" required></select>

    <label>Nominado ganador:</label>
    <select id="id_candidatura" required></select>

    <!-- BOTONES -->
    <div style="display:flex; gap:1rem; margin-top:1.5rem; flex-wrap:wrap;">
      <button class="btn login-btn" type="submit">
        Guardar ganador
      </button>

      
      <button
      type="button"
      class="btn login-btn"
       style="background:#555;"
      onclick="window.location.href='ganadores.html'">
      Salir sin guardar
      </button>

    </div>

  </form>

</main>

<footer class="footer">

  <div class="footer-main">

    
    <div class="footer-col footer-brand">
      <img src="../IMG/logo-ue-blanco.png" alt="Festival Universitario" class="footer-logo">
      <p class="footer-tagline">Talento universitario en acción</p>
    </div>

    
    <div class="footer-col footer-links">
      <a href="quienes-somos.html">Quiénes somos</a>
      <a href="contacto.html">Contacta con nosotros</a>
    </div>

    <!-- COLUMNA 3 · REDES -->
    <div class="footer-col footer-social">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      <a href="#" aria-label="X"><i class="fab fa-x-twitter"></i></a>
    </div>

  </div>

  <!-- FRANJA ROJA -->
  <div class="footer-bottom">
    © 2026 Festival Universitario
  </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/ganador-asignar.js"></script>

</body>
</html>
