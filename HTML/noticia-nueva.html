  <header class="navbar">

    </div>

  <main class="login-container">

    <h2 class="page-title">Añadir noticia</h2>

    <form id="form-noticia" class="login-form form-noticia" enctype="multipart/form-data">

      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" required>
      <span class="error-campo" id="error-titulo"></span>

      <label for="contenido">Contenido</label>
      <textarea id="contenido" name="contenido" rows="5" required class="textarea-noticia"></textarea>
      <span class="error-campo" id="error-contenido"></span>

      <label for="imagen">Imagen de la noticia</label>
      <input type="file" id="imagen" name="imagen" accept="image/*">

      <div class="error-global" id="error-global"></div>

      <button type="submit" class="btn login-btn btn-guardar-noticia">Guardar noticia</button>
       <button
      type="button"
      class="btn login-btn"
       style="background:#555;"
      onclick="window.location.href='noticias.html'">
      Salir sin guardar
      </button>
    </form>

  </main>
