<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar noticia</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <script defer src="../JS/noticias.js"></script>
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body data-rol="organizador">

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>
   <div class="nav-right">
         <a href="noticias.html" style="text-decoration: none; color: rgb(30, 30, 30);">Noticias</a>
         
      
  </div>


  <div class="nav-buttons">
    <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">

  <h2 class="page-title">Editar noticia</h2>

  <!-- IMPORTANTE: enctype añadido -->
  <form id="form-noticia" class="login-form form-noticia" enctype="multipart/form-data">

    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" required>
    <span class="error-campo" id="error-titulo"></span>

    <label for="contenido">Contenido</label>
    <textarea
      id="contenido"
      name="contenido"
      rows="5"
      required
      class="textarea-noticia"
    ></textarea>
    <span class="error-campo" id="error-contenido"></span>

    <!-- Vista previa de la imagen actual -->
    <label>Imagen actual</label>
    <img
      id="imagen-actual"
      src=""
      alt="Imagen actual"
      class="imagen-actual"
    >

    <!-- Subir nueva imagen -->
    <label for="imagen">Cambiar imagen</label>
    <input type="file" id="imagen" name="imagen" accept="image/*">

    <div class="error-global" id="error-global"></div>

    <button type="submit" class="btn login-btn">
      Guardar cambios
    </button>

  </form>

</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
       <a href="../HTML/sobre_nosotros.html" class="footer-contact-link">Sobre nosotros: ¿Quiénes Somos?</a><br>
        <a href="../HTML/contacto.html" class="footer-contact-link">Contáctanos</a>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/auth.js"></script>
<script src="../JS/noticias.js"></script>

</body>
</html>
