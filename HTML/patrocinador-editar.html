<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar patrocinador</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <script defer src="../JS/patrocinadores.js"></script>
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body data-rol="organizador">

  <header class="navbar">
    <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
    </div>


      <div class="nav-right">
          <a href="patrocinadores.html" style="text-decoration: none; color: rgb(30, 30, 30);">Patrocinadores</a>
      
  </div>

    <div class="nav-buttons">
      <a href="login.html" class="btn nav-btn">Salir</a>
    </div>
  </header>

  <main class="login-container">
    <h2 class="page-title">Editar patrocinador</h2>

    <form id="form-patrocinador" class="login-form">

      <label for="nombre">Nombre del patrocinador</label>
      <input type="text" id="nombre" name="nombre" required>
      <span class="error-campo" id="error-nombre"></span>

      <label for="logo">Logo (imagen)</label>
      <input type="file" id="logo" name="logo" accept="image/*">
      <span class="error-campo" id="error-logo"></span>

      <label for="enlace">Enlace web</label>
      <input type="text" id="enlace" name="enlace" placeholder="https://www.ejemplo.com" required>
      <span class="error-campo" id="error-enlace"></span>

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="4" class="textarea-descripcion"></textarea>
      <span class="error-campo" id="error-descripcion"></span>

      <div class="error-global" id="error-global"></div>

      <button type="submit" class="btn login-btn btn-guardar-patrocinador">Guardar cambios</button>
    </form>
  </main>

  <footer class="footer">

  <div class="footer-main">

    
    <div class="footer-col footer-brand">
      <img src="../IMG/logo-ue-blanco.png" alt="Festival Universitario" class="footer-logo">
      <p class="footer-tagline">Talento universitario en acción</p>
    </div>

    
    <div class="footer-col footer-links">
      <a href="quienes-somos.html">Quiénes somos</a>
      <a href="contacto.html">Contacta con nosotros</a>
    </div>

    <!-- COLUMNA 3 · REDES -->
    <div class="footer-col footer-social">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      <a href="#" aria-label="X"><i class="fab fa-x-twitter"></i></a>
    </div>

  </div>

  <!-- FRANJA ROJA -->
  <div class="footer-bottom">
    © 2026 Festival Universitario
  </div>

</footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../JS/auth.js"></script>
  <script src="../js/patrocinadores.js"></script>

</body>

</html>
