<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar evento</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png">
</head>

<body data-rol="organizador">

  <header class="navbar">
    <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo">
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Buscar...">
    </div>

    <nav>
      <ul class="nav-links">
        <li><a href="eventos.html">Eventos</a></li>
        <li><a href="sobre_nosotros.html">Sobre nosotros</a></li>
      </ul>
    </nav>

    <div class="nav-buttons">
      <a href="login.html" class="btn nav-btn">Salir</a>
    </div>

  </header>

  <main class="login-container">
    <h2>Editar evento</h2>

    <form id="form-evento" class="login-form">

      <label>Título</label>
      <input type="text" id="titulo" required>
      <span id="error-titulo"></span>

      <label>Fecha</label>
      <input type="date" id="fecha" required>
      <span id="error-fecha"></span>

      <label>Hora</label>
      <input type="time" id="hora" required>
      <span id="error-hora"></span>

      <label>Descripción</label>
      <textarea id="descripcion" rows="5" required></textarea>
      <span id="error-descripcion"></span>

      <div id="error-global"></div>

      <button type="submit" class="btn login-btn">Guardar cambios</button>
    </form>
  </main>

  <footer class="footer">
    <div class="footer-main">
      <div class="footer-left">
        <div class="footer-social-row">
          <img src="../IMG/instagram.png" alt="Instagram">
          <span>@cortosuem</span>
        </div>
        <div class="footer-social-row">
          <img src="../IMG/facebook.png" alt="Facebook">
          <span>@cortosuem</span>
        </div>
        <div class="footer-social-row">
          <img src="../IMG/twitter.png" alt="Twitter">
          <span>@cortosuem</span>
        </div>
      </div>

      <div class="footer-center">
      <a href="../HTML/sobre_nosotros.html" class="footer-contact-link">Sobre nosotros: ¿Quiénes Somos?</a><br>
      <a href="../HTML/contacto.html" class="footer-contact-link">Contáctanos</a>
      </div>

      <div class="footer-right">
        <div class="footer-logo-circle">
          <img src="../IMG/logosimple.jpg" alt="Logo">
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      Universidad Europea © 2025. Todos los Derechos Reservados
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../JS/auth.js"></script>
  <script src="../JS/eventos.js"></script>

</body>

</html>
