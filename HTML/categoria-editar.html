<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar categoría</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <script defer src="../JS/premios.js"></script>
</head>
<body>

<header class="navbar">
  <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
      <input type="text" placeholder="Buscar...">
  </div>

  <nav>
   <ul class="nav-links">
      <li><a href="organizador.html">Panel</a></li>
      <li><a href="premios.html">Premios</a></li>
   </ul>
  </nav>

  <div class="nav-buttons">
      <a href="login.html" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">
  <h2>Editar categoría</h2>

  <form id="form-categoria" class="login-form">

    <label for="nombre">Nombre de la categoría</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error-campo" id="error-nombre"></span>

    <label for="premios">Descripción de premios</label>
    <input type="text" id="premios" name="premios" placeholder="Ej: 1º y 2º premio" required>
    <span class="error-campo" id="error-premios"></span>

    <label for="premio-fisico">Premio físico</label>
    <input type="text" id="premio-fisico" name="premio-fisico" placeholder="Ej: Cámara Canon, ninguno..." required>
    <span class="error-campo" id="error-premio-fisico"></span>

    <div class="error-global" id="error-global"></div>

    <button type="submit" class="btn login-btn">Guardar cambios</button>
  </form>
</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
      <p>Contacta con nosotros</p>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

</body>
</html>
