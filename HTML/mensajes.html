<!DOCTYPE html>
<html lang="es">

<head>

  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png">
</head>

<body data-rol="participante">

  <header class="navbar">
    <div class="logo">
      <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
    </div>

    <div class="nav-right">
           <a href="participante.html">Panel</a>
      
       <a href="calendario.html">Calendario</a>
  </div>


    <div class="nav-buttons">
      <a href="../php/logout.php" class="btn nav-btn">Salir</a>
    </div>
  </header>

  <main class="login-container">

    <h2>Enviar mensaje al organizador</h2>

    <form id="formMensaje" class="panel-card">

      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit" class="btn login-btn">Enviar mensaje</button>

    </form>

    <div id="respuesta"></div>

  </main>

  <footer class="footer">
    <div class="footer-main">
      <div class="footer-left">
        <div class="footer-social-row">
          <img src="../IMG/instagram.png" alt="Instagram">
          <span>@cortosuem</span>
        </div>
        <div class="footer-social-row">
          <img src="../IMG/facebook.png" alt="Facebook">
          <span>@cortosuem</span>
        </div>
        <div class="footer-social-row">
          <img src="../IMG/twitter.png" alt="Twitter">
          <span>@cortosuem</span>
        </div>
      </div>

    <div class="footer-center">
        <a href="../HTML/sobre_nosotros.html" class="footer-contact-link">Sobre nosotros: ¿Quiénes Somos?</a><br>
        <a href="../HTML/contacto.html" class="footer-contact-link">Contáctanos</a>

    </div>


      <div class="footer-right">
        <div class="footer-logo-circle">
          <img src="../IMG/logosimple.jpg" alt="Logo">
        </div>

    </div>

    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.getElementById("formMensaje").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const mensaje = document.getElementById("mensaje").value.trim();

      const res = await fetch("../php/enviar_mensaje.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, mensaje })
      });

      const data = await res.json();

      if (data.ok) {
        Swal.fire("Enviado", "Tu mensaje ha sido enviado al organizador", "success");
        document.getElementById("formMensaje").reset();
      } else {
        Swal.fire("Error", data.msg, "error");
      }
    });
  </script>

</body>

</html>
