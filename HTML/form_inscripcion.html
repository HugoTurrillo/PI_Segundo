<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción de candidatura</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="participante.html">Panel</a></li>
      <li><a href="participante_candidatura.html">Mi candidatura</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="../php/logout.php" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">
  <div class="form-wrapper form-card" style="
    background:#fff;
    padding:40px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,0.12);
    max-width:700px;
    width:100%;
  ">

    <h2 style="text-align:center; margin-bottom:10px;">Formulario de inscripción</h2>
    <p style="text-align:center; margin-bottom:25px; color:#666;">
      Completa todos los campos requeridos para registrar tu obra.
    </p>

    <form id="form-candidatura" class="styled-form">

      <!-- TÍTULO -->
      <div class="form-group">
        <label>Título del cortometraje</label>
        <input type="text" id="titulo_obra" required minlength="2">
        <span class="error" id="error-titulo"></span>
      </div>

      <!-- CARTEL -->
      <div class="form-group">
        <label>Cartel del cortometraje (imagen)</label>
        <input type="file" id="cartel" accept="image/*" required>
      </div>

      <!-- SINOPSIS -->
      <div class="form-group">
        <label>Sinopsis</label>
        <textarea id="sinopsis" rows="4" required></textarea>
      </div>

      <!-- CONTACTO -->
      <div class="form-group">
        <label>Nombre de contacto</label>
        <input type="text" id="nombre_contacto" required>
      </div>

      <div class="form-group">
        <label>Email de contacto</label>
        <input type="email" id="email_contacto" required>
      </div>

      <!-- DNI -->
      <div class="form-group">
        <label>Sinopsis</label>
        <textarea id="dni" rows="4" required></textarea>
      </div>

      <!-- EXPEDIENTE -->
      <div class="form-group">
        <label>Nº Expediente</label>
        <input type="file" id="expediente" required>
      </div>

      <!-- VÍDEO -->
      <div class="form-group">
        <label>Vídeo del cortometraje (MP4)</label>
        <input type="file" id="video" accept="video/mp4" required>
      </div>

      <span class="error" id="error-global"></span>

      <button type="submit" class="btn-submit full-width" style="
        width:100%;
        padding:14px;
        font-size:18px;
        background:#c00;
        color:#fff;
        border:none;
        border-radius:8px;
        cursor:pointer;
      ">
        Enviar inscripción
      </button>

    </form>

  </div>
</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
      <p>Contacta con nosotros</p>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="../JS/candidatura-nueva.js"></script>

</body>
</html>
