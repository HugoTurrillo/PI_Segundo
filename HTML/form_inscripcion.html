<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva candidatura</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
</head>

<body data-rol="participante">

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Buscar...">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="participante.html">Panel</a></li>
      <li><a href="calendario.html">Calendario</a></li>
      <li><a href="sobre_nosotros.html">Sobre nosotros</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="../php/logout.php" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">

  <h2>Nueva candidatura</h2>

  <form id="form-candidatura" class="login-form" enctype="multipart/form-data">

    <label>Nombre de contacto</label>
    <input type="text" id="nombre_contacto" name="nombre_contacto" readonly>

    <label>Email de contacto</label>
    <input type="email" id="email_contacto" name="email_contacto" readonly>

    <label>Perfil de participación</label>
    <input type="text" id="perfil_participante" readonly>

    <label>Título de la obra</label>
    <input type="text" name="titulo_obra" required>

    <label>Sinopsis</label>
    <textarea name="sinopsis" required></textarea>

    <label>DNI</label>
    <input type="text" name="dni" required>

    <!-- VIDEO RESTAURADO -->
    <label>Vídeo</label>
    <input type="file" name="video" accept="video/*" required>

    <label>Portada</label>
    <input type="file" name="portada" accept="image/*" required>

    <div id="error-global" class="error-global"></div>

    <button type="submit" class="btn login-btn">
      Enviar candidatura
    </button>

  </form>

</main>

<footer class="footer">
  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../JS/candidatura-nueva.js"></script>

</body>
</html>
