<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de inscripción - Festival Cortos UEM</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
  <link rel="icon" href="../IMG/favicon.png" type="image/x-icon">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png" alt="Logo Universidad Europea">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="participante.html">Panel</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="../php/logout.php" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">
  <div class="form-wrapper form-card" style="
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      max-width: 850px;
      width: 100%;
  ">

    <h2 class="form-title" style="text-align:center; margin-bottom:10px; font-size:28px;">Formulario de inscripción</h2>
    <p class="form-subtitle" style="text-align:center; margin-bottom:30px; color:#666;">Introduce tus datos y envía tu cortometraje.</p>

    <form action="../php/procesar_inscripcion.php" method="POST" enctype="multipart/form-data" class="styled-form">

      <!-- DATOS DEL PARTICIPANTE -->
      <div class="form-section" style="margin-bottom:35px;">
        <h3 class="section-title" style="margin-bottom:15px; font-size:22px; border-left:4px solid #c00; padding-left:10px;">Datos del participante</h3>

        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          
          <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" name="nombre_completo" required minlength="3">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" name="telefono" pattern="[0-9]{9}" required>
          </div>

          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required minlength="6">
          </div>

        </div>
      </div>

      <!-- DATOS DE LA CANDIDATURA -->
      <div class="form-section" style="margin-bottom:35px;">
        <h3 class="section-title" style="margin-bottom:15px; font-size:22px; border-left:4px solid #c00; padding-left:10px;">Datos de la candidatura</h3>

        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
          
          <div class="form-group">
            <label>Título del cortometraje</label>
            <input type="text" name="titulo_obra" required minlength="2">
          </div>

          <div class="form-group" style="margin-bottom:20px;">
            <label>Sinopsis</label>
            <textarea name="sinopsis" rows="4" required></textarea>
          </div>
        </div>

        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px;">
          
          <div class="form-group">
            <label>Nombre de contacto</label>
            <input type="text" name="nombre_contacto" required>
          </div>

          <div class="form-group">
            <label>Email de contacto</label>
            <input type="email" name="email_contacto" required>
          </div>

          <div class="form-group">
            <label>DNI</label>
            <input type="text" name="dni" required>
          </div>
        </div>

        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
          
          <div class="form-group">
            <label>Categoría</label>
            <select name="id_categoria" required>
              <option value="">Selecciona una categoría</option>
              <option value="1">Ficción</option>
              <option value="2">Documental</option>
              <option value="3">Animación</option>
              <option value="4">Experimental</option>
            </select>
          </div>

          <div class="form-group">
            <label>Edición del festival</label>
            <select name="id_edicion" required>
              <option value="">Selecciona edición</option>
              <option value="1">Edición 2025</option>
              <option value="2">Edición 2026</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top:20px;">
          <label>Subir vídeo (MP4, máx. 500MB)</label>
          <input type="file" name="video" accept="video/mp4" required>
        </div>

      </div>

      <button type="submit" class="btn-submit full-width" style="
          width:100%;
          padding:14px;
          font-size:18px;
          background:#c00;
          color:#fff;
          border:none;
          border-radius:8px;
          cursor:pointer;
          transition:0.3s;
      ">Enviar inscripción</button>

    </form>
  </div>
</main>

<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">

        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
