<main class="login-container">

  <h2>Nueva candidatura</h2>

 <form id="form-candidatura" class="login-form" method="POST" enctype="multipart/form-data">


    <label>Categoría</label>
    <select id="categoria" name="categoria" required>
        <option value="">Selecciona una categoría</option>
    </select>

    <label>Título de la obra</label>
    <input type="text" id="titulo_obra" name="titulo_obra" required>

    <label>Sinopsis</label>
    <textarea id="sinopsis" name="sinopsis" required></textarea>

    <label>Vídeo</label>
    <input type="file" name="video" accept="video/*" required>

    <label>Portada</label>
    <input type="file" name="portada" accept="image/*" required>

    <div id="error-global" class="error-global"></div>

    <button type="submit" class="btn login-btn">
      Enviar candidatura
    </button>

  </form>

</main>
