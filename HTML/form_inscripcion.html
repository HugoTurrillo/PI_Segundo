<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar candidatura</title>
  <link rel="stylesheet" href="../CSS/estilos.css">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <img src="../IMG/LOGOENTERO.png">
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="participante.html">Panel</a></li>
    </ul>
  </nav>

  <div class="nav-buttons">
    <a href="../php/logout.php" class="btn nav-btn">Salir</a>
  </div>
</header>

<main class="login-container">

  <h2>Enviar candidatura</h2>

  <form id="form-candidatura">

    <label>Título del cortometraje</label>
    <input type="text" id="titulo_obra" required>

    <label>Sinopsis</label>
    <textarea id="sinopsis" rows="4" required></textarea>

    <label>Nombre de contacto</label>
    <input type="text" id="nombre_contacto" required>

    <label>Email de contacto</label>
    <input type="email" id="email_contacto" required>

    <label>DNI</label>
    <input type="text" id="dni" required>

    <p id="error-global" style="color:red; margin-top:1rem;"></p>

    <button type="submit" class="btn login-btn">
      Enviar candidatura
    </button>

  </form>

</main>
<!-- ================= FOOTER ================= -->
<footer class="footer">
  <div class="footer-main">
    <div class="footer-left">
      <div class="footer-social-row">
        <img src="../IMG/instagram.png" alt="Instagram">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/facebook.png" alt="Facebook">
        <span>@cortosuem</span>
      </div>
      <div class="footer-social-row">
        <img src="../IMG/twitter.png" alt="Twitter">
        <span>@cortosuem</span>
      </div>
    </div>

    <div class="footer-center">
      <p>Contacta con nosotros</p>
    </div>

    <div class="footer-right">
      <div class="footer-logo-circle">
        <img src="../IMG/logosimple.jpg" alt="Logo">
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    Universidad Europea © 2025. Todos los Derechos Reservados
  </div>
</footer>

<script src="../JS/candidatura-nueva.js"></script>
</body>
</html>
